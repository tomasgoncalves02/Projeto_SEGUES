trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  # Nome exato confirmado na sua imagem do portal
  webAppName: 'segues-projeto-esa-pv'     
  azureServiceConnection: 'ConexaoAzure' 

stages:
- stage: Build
  displayName: 'CI - Compilar Projeto'
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      displayName: 'Instalar .NET SDK 8.x'
      inputs:
        version: '8.x'

    # O comando publish agora gera explicitamente um ficheiro ZIP
    - script: dotnet publish --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)
      displayName: 'Publicar Projeto'

    - task: ArchiveFiles@2
      displayName: 'Zipar Artefactos'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    - publish: $(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip
      artifact: drop
      displayName: 'Guardar Artefacto ZIP'

- stage: Deploy
  displayName: 'CD - Enviar para o Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployJob
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy para App Service (Windows)'
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: 'webApp' # Definido como Web App (Windows)
              appName: $(webAppName)
              # Caminho exato para o ficheiro zipado
              package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'